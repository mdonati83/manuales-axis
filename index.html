<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Axis Pro | Manual de ensamblaje</title>

    <style>
        body {
            background: #141619;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 24px;
        }

        header {
            text-align: center;
            padding: 20px 0 30px;
        }

        .logo {
            width: 180px;
            max-width: 60%;
            height: auto;
            object-fit: contain;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 20px;
        }

        video {
            width: 100%;
            border-radius: 8px;
        }

        button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            background: #25282c;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <img
            src="logo-white.png"
            alt="Axis Simuladores"
            class="logo"
        >

        <p class="subtitle">
            Axis Pro · Manual de ensamblaje
        </p>
    </header>

    <video id="player" controls playsinline preload="metadata">
        <source src="assembly.mp4" type="video/mp4">
    </video>

    <h2>Capítulos</h2>

    <button onclick="seek(4)">01 — Estructura base</button>
    <button onclick="seek(65)">02 — Niveladores</button>
    <button onclick="seek(72)">03 — Columnas</button>
    <button onclick="seek(91)">04 — Pedalera</button>
    <button onclick="seek(104)">05 - Perfil para base de volante</button>
    <button onclick="seek(125)">06 - Soporte para base de volante</button>
    <button onclick="seek(137)">07 - Soporte para butaca</button>

    <script>
        function seek(seconds) {
            const player = document.getElementById("player");
            player.currentTime = seconds;
            player.play();
        }
    </script>

</body>
</html>
